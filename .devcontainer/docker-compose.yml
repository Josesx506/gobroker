version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    network_mode: service:db
    env_file:
        - .dev.env
    volumes:
      - ../..:/workspaces:cached

  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .dev.env

volumes:
  postgres-data: